<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotwire Cutter</title>
<style>
  html, body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }

  body {
    background-color: #808080;
  }

  .panel {
    display: grid;
    grid-template-columns: 100px 100px 100px;
    grid-template-rows: 60px 100px 100px;
    column-gap: 10px;
    row-gap: 0;
    width: 320px;
    height: 260px;
    grid-template-areas:
      "knife-icon bed-icon ."
      "knife-up   bed-up    home"
      "knife-down bed-down  .";
  }

  .icon-cell {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn {
    border: 0;
    padding: 0;
    font: inherit;
    cursor: pointer;
    width: 100px;
    height: 100px;
    background: rgba(128, 128, 128, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .btn-up {
    border-radius: 10px 10px 0 0;
    box-shadow: inset 0 5px 5px rgba(0, 0, 0, 0.25);
  }

  .btn-down {
    border-radius: 0 0 10px 10px;
    box-shadow: 0 5px 2.5px rgba(0, 0, 0, 0.25);
    border-top: 1px solid rgba(0, 0, 0, 0.3);
  }

  .btn-home {
    border-radius: 10px;
    box-shadow: 0 5px 5px rgba(0, 0, 0, 0.25), inset 0 5px 5px rgba(0, 0, 0, 0.25);
  }

  .ga-knife-icon { grid-area: knife-icon; }
  .ga-bed-icon   { grid-area: bed-icon; }
  .ga-knife-up   { grid-area: knife-up; }
  .ga-bed-up     { grid-area: bed-up; }
  .ga-home       { grid-area: home; }
  .ga-knife-down { grid-area: knife-down; }
  .ga-bed-down   { grid-area: bed-down; }
</style>
</head>
<body>
  <div class="panel">

    <div class="icon-cell ga-knife-icon">

      </svg>
    </div>

      </svg>
    </div>

    <button class="btn btn-up ga-knife-up" aria-label="Knife up">

      </svg>
    </button>

    <button class="btn btn-up ga-bed-up" aria-label="Bed up">

      </svg>
    </button>

    <button class="btn btn-down ga-knife-down" aria-label="Knife down">
      <span style="display: inline-flex; transform: rotate(180deg);">
        <svg width="60" height="60" viewBox="0 0 54.6559 50" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.9978 2.5C24.9223 -0.833334 29.7336 -0.833333 31.6581 2.5L48.9786 32.5C50.9031 35.8333 48.4975 40 44.6485 40H10.0075C6.15846 40 3.75283 35.8333 5.67733 32.5L22.9978 2.5Z" fill="black"/>
        </svg>
      </span>
    </button>

    <button class="btn btn-down ga-bed-down" aria-label="Bed down">
      <span style="display: inline-flex; transform: rotate(180deg);">
        <svg width="60" height="60" viewBox="0 0 54.6559 50" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.9978 2.5C24.9223 -0.833334 29.7336 -0.833333 31.6581 2.5L48.9786 32.5C50.9031 35.8333 48.4975 40 44.6485 40H10.0075C6.15846 40 3.75283 35.8333 5.67733 32.5L22.9978 2.5Z" fill="black"/>
        </svg>
      </span>
    </button>

  </div>
</body>
</html>
