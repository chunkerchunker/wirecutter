board: Jackpot V2 TMC2226
name: HotWire
meta: 09/13/2026 Choi

planner_blocks: 32

stepping:
  engine: I2S_STATIC
  idle_ms: 255
  pulse_us: 2
  dir_delay_us: 1
  disable_delay_us: 0

uart1:
  txd_pin: gpio.16
  rxd_pin: gpio.4
  rts_pin: NO_PIN
  baud: 115200
  mode: 8N1

axes:
  shared_stepper_disable_pin: NO_PIN

  y:
    steps_per_mm: 1481.5878338736
    max_rate_mm_per_min: 6500.000
    acceleration_mm_per_sec2: 80.000
    max_travel_mm: 262.000
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 300.000
      seek_mm_per_min: 2000.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100

    motor0:
      limit_neg_pin: gpio.34.high
      limit_pos_pin: gpio.35:high
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 3.000
      tmc_2209:
        uart_num: 1
        addr: 3
        cs_pin: i2so.14
        r_sense_ohms: 0.110
        run_amps: 1.400
        homing_amps: 0.800
        hold_amps: 0.700
        microsteps: 256
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        step_pin: I2SO.13
        direction_pin: I2SO.12
        disable_pin: I2SO.15

  a:
    steps_per_mm: 1481.5878338736
    max_rate_mm_per_min: 6500.000
    acceleration_mm_per_sec2: 80.000
    max_travel_mm: 1000.000
    soft_limits: false
    # homing:
    #   cycle: 1
    #   positive_direction: false
    #   mpos_mm: 0
    #   feed_mm_per_min: 300.000
    #   seek_mm_per_min: 2000.000
    #   settle_ms: 500
    #   seek_scaler: 1.100
    #   feed_scaler: 1.100

    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 3.000
      tmc_2209:
        uart_num: 1
        addr: 1
        cs_pin: NO_PIN
        r_sense_ohms: 0.110
        run_amps: 1.400
        homing_amps: 0.800
        hold_amps: 0.700
        microsteps: 256
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        step_pin: I2SO.5
        direction_pin: I2SO.4
        disable_pin: I2SO.7

  z:
    steps_per_mm: 1481.5878338736
    max_rate_mm_per_min: 6500.000
    acceleration_mm_per_sec2: 80.000
    max_travel_mm: 294.000
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 300.000
      seek_mm_per_min: 2000.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100

    motor0:
      limit_neg_pin: gpio.36.high
      limit_pos_pin: gpio.39:high
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 3.000
      tmc_2209:
        uart_num: 1
        addr: 2
        cs_pin: NO_PIN
        r_sense_ohms: 0.110
        run_amps: 1.400
        homing_amps: 0.800
        hold_amps: 0.700
        microsteps: 256
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        step_pin: I2SO.10
        direction_pin: I2SO.9
        disable_pin: I2SO.8

i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.5
  card_detect_pin: NO_PIN
  frequency_hz: 20000000

probe:
  pin: NO_PIN
  toolsetter_pin: NO_PIN
  check_mode_start: false

start:
  must_home: true

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN

macros:
  after_homing: G92 X0 Y0 Z0
  startup_line0:
  startup_line1:
  macro0:
  macro1:
  macro2:
  macro3:

user_inputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  digital0_pin: gpio.25:high
  digital1_pin: gpio.33:high
  digital2_pin: gpio.32:high
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN

user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: gpio.26
  digital1_pin: gpio.27
  digital2_pin: gpio.2
  digital3_pin: NO_PIN

